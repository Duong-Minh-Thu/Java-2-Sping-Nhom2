<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Volunteer Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .container { margin-top: 50px; }
        .table-responsive { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .action-btns .btn { margin: 0 2px; }
    </style>
</head>
<body>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-primary fw-bold">Volunteer Management</h2>
        <a th:href="@{/volunteers/create}" class="btn btn-primary shadow-sm">+ Add New Volunteer</a>
    </div>

    <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Skills</th>
                    <th class="text-center">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="volunteer : ${volunteers}">
                    <td class="fw-bold text-muted" th:text="${volunteer.id}">1</td>
                    <td th:text="${volunteer.name}">John Doe</td>
                    <td th:text="${volunteer.email}">john@example.com</td>
                    <td th:text="${volunteer.phone}">123456789</td>
                    <td th:text="${volunteer.skills}">Java, Spring</td>
                    <td class="text-center action-btns">
                        <a th:href="@{/volunteers/{id}(id=${volunteer.id})}" class="btn btn-sm btn-outline-info">View</a>
                        <a th:href="@{/volunteers/{id}/edit(id=${volunteer.id})}" class="btn btn-sm btn-outline-warning">Edit</a>
                        <a th:href="@{/volunteers/{id}/delete(id=${volunteer.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Are you sure you want to delete this volunteer?');">Delete</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(volunteers)}">
                    <td colspan="6" class="text-center text-muted py-4">
                        <p class="mb-0">No volunteers found. Click "Add New Volunteer" to get started.</p>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
